[workspace]
resolver = "3"
members = ["crates/kct-core", "crates/kct-client", "crates/kct-tui", "crates/kct"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/avsystem/keycloak-tui"
authors = ["Andrzej Świętek <a.swietek@avsystem.com>"]

[workspace.dependencies]
kct-core   = { path = "crates/kct-core" }
kct-client = { path = "crates/kct-client" }
kct-tui    = { path = "crates/kct-tui" }

serde        = { version = "1.0.229", features = ["derive", "rc"] }
serde_json   = { version = "1.0.151", features = ["preserve_order"] }
thiserror    = "2.0.20"
async-trait  = "0.1.92"
tokio        = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal"] }
tokio-util   = "0.7.19"
futures      = "0.3.34"
reqwest      = { version = "0.13.5", default-features = false, features = ["json", "query", "form", "rustls", "http2", "gzip", "stream", "charset", "system-proxy"] }
url          = "2.5.8"
ratatui      = "0.30.2"
crossterm    = { version = "0.29.0", features = ["event-stream"] }
nucleo-matcher = "0.3.1"
unicode-width  = "0.2.2"
clap         = { version = "4.6", features = ["derive", "env", "wrap_help"] }
toml         = "1.1"
directories  = "6.0"
png          = "0.18"
tracing      = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
chrono       = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
base64       = "0.23.1"
anyhow       = "1.0.104"
humantime    = "2.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
